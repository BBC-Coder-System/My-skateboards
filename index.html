<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Phase 2 Protocol Crack</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; padding: 15px; max-width: 500px; margin: 0 auto; text-align: center; }
        h1 { font-size: 18px; color: #00f0ff; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #333; }
        button { padding: 10px 14px; font-size: 13px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 4px; display: block; width: 100%; }
        .btn-main { background: #00f0ff; color: #000; font-size: 15px; }
        .btn-hex { background: #2d3748; color: #63b3ed; border: 1px solid #4a5568; text-align: left; }
        #log { background: #000; color: #00ff00; font-family: monospace; font-size: 11px; text-align: left; padding: 8px; border-radius: 6px; height: 140px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🔍 Phase 2: Color Opcode Crack</h1>
    <div id="status" style="color: #ecc94b; font-size: 13px; margin-bottom: 8px;">Status: Disconnected</div>

    <div class="card">
        <button class="btn-main" onclick="connectBLE()">Connect BLE Controller</button>
    </div>

    <div class="card">
        <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 6px;">TEST SUITE: RED COLOR OPCODES</label>
        
        <!-- Standard Color Opcode Variations -->
        <button class="btn-hex" onclick="send('7e0001ff0000000000ef')">1. Opcode 01 (RGB): 7e0001ff0000000000ef</button>
        <button class="btn-hex" onclick="send('7e0002ff0000000000ef')">2. Opcode 02 (RGB): 7e0002ff0000000000ef</button>
        <button class="btn-hex" onclick="send('7e0003ff0000000000ef')">3. Opcode 03 (RGB): 7e0003ff0000000000ef</button>
        <button class="btn-hex" onclick="send('7e0005ff0000000000ef')">4. Opcode 05 (RGB): 7e0005ff0000000000ef</button>
        <button class="btn-hex" onclick="send('7e0007ff0000000000ef')">5. Opcode 07 (RGB): 7e0007ff0000000000ef</button>

        <!-- Addressable / Strip Specific Formats -->
        <button class="btn-hex" onclick="send('7e000503ff00000000ef')">6. Sub-Op 05 03: 7e000503ff00000000ef</button>
        <button class="btn-hex" onclick="send('7e000501ff00000000ef')">7. Sub-Op 05 01: 7e000501ff00000000ef</button>
        <button class="btn-hex" onclick="send('7e000800ff00000000ef')">8. Opcode 08: 7e000800ff00000000ef</button>

        <!-- RGBW (4-Color / 10-Byte) Format -->
        <button class="btn-hex" onclick="send('7e000503ff0000000000ef')">9. RGBW Format: 7e000503ff0000000000ef</button>
    </div>

    <div id="log">--- Execution Log ---<br></div>

    <script>
        let bleDevice, bleCharacteristic;

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += msg + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function connectBLE() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
                
                document.getElementById('status').innerText = "Connected!";
                document.getElementById('status').style.color = "#48bb78";
                log("Connected to BLE.");
            } catch (e) {
                log("Err: " + e.message);
            }
        }

        async function send(hex) {
            if (!bleCharacteristic) {
                log("Err: Connect BLE first!");
                return;
            }
            log("Sending: " + hex);
            try {
                const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                if (bleCharacteristic.properties.writeWithoutResponse) {
                    await bleCharacteristic.writeValueWithoutResponse(bytes);
                } else {
                    await bleCharacteristic.writeValue(bytes);
                }
                log("-> Sent!");
            } catch (e) {
                log("-> Failed: " + e.message);
            }
        }
    </script>
</body>
</html>
