<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skateboard LED Controller</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; padding: 20px; }
        button { padding: 15px 25px; font-size: 18px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-connect { background: #007bff; color: white; }
        .btn-red { background: #ff0000; color: white; }
        .btn-green { background: #00ff00; color: black; }
        .btn-blue { background: #0000ff; color: white; }
        .btn-rainbow { background: linear-gradient(90deg, red, yellow, green, cyan, blue, magenta); color: white; }
        .btn-off { background: #444; color: white; }
    </style>
</head>
<body>
    <h1>🛹 Skateboard Light Control</h1>
    <button class="btn-connect" onclick="connectBLE()">Connect to Lights</button>
    <hr style="border-color: #333; margin: 20px 0;">
    <div>
        <button class="btn-red" onclick="setColor(255, 0, 0)">Red</button>
        <button class="btn-green" onclick="setColor(0, 255, 0)">Green</button>
        <button class="btn-blue" onclick="setColor(0, 0, 255)">Blue</button>
    </div>
    <div>
        <button class="btn-rainbow" onclick="sendHex('7e05038703000000ef')">Rainbow Effect</button>
        <button class="btn-off" onclick="setColor(0, 0, 0)">Turn Off</button>
    </div>

    <script>
        let bleDevice, bleCharacteristic;

        async function connectBLE() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ELK' }, { namePrefix: 'BLED' }, { namePrefix: 'Lotus' }],
                    optionalServices: [0xFFF0]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(0xFFF0);
                bleCharacteristic = await service.getCharacteristic(0xFFF3);
                alert("Connected to Skateboard LED!");
            } catch (error) {
                alert("Connection failed: " + error);
            }
        }

        async function sendHex(hexString) {
            if (!bleCharacteristic) return alert("Please connect first!");
            const bytes = new Uint8Array(hexString.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            await bleCharacteristic.writeValue(bytes);
        }

        function setColor(r, g, b) {
            const hexR = r.toString(16).padStart(2, '0');
            const hexG = g.toString(16).padStart(2, '0');
            const hexB = b.toString(16).padStart(2, '0');
            sendHex(`7e070503${hexR}${hexG}${hexB}00ef`);
        }
    </script>
</body>
</html>
