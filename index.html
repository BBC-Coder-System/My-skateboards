<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skateboard Light Control</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #121212; color: #fff; padding: 20px; }
        button { padding: 16px 24px; font-size: 18px; margin: 8px; border: none; border-radius: 12px; font-weight: bold; width: 80%; max-width: 300px; cursor: pointer; }
        .btn-connect { background: #007bff; color: white; margin-bottom: 20px; }
        .btn-red { background: #ff3b30; color: white; }
        .btn-green { background: #34c759; color: white; }
        .btn-blue { background: #007aff; color: white; }
        .btn-rainbow { background: linear-gradient(90deg, red, yellow, green, cyan, blue, magenta); color: white; }
        .btn-off { background: #333; color: #888; }
        #status { margin: 15px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🛹 Skateboard Lights</h1>
    <button class="btn-connect" onclick="connectBLE()">Connect to Lights</button>
    <div id="status">Status: Disconnected</div>
    <hr style="border-color: #222; margin: 20px 0;">
    <div>
        <button class="btn-red" onclick="setColor(255, 0, 0)">Red</button>
        <button class="btn-green" onclick="setColor(0, 255, 0)">Green</button>
        <button class="btn-blue" onclick="setColor(0, 0, 255)">Blue</button>
        <button class="btn-rainbow" onclick="sendHex('7e05038703000000ef')">Rainbow Effect</button>
        <button class="btn-off" onclick="setColor(0, 0, 0)">Turn Off</button>
    </div>

    <script>
        let bleDevice, bleCharacteristic;

        async function connectBLE() {
            const statusDiv = document.getElementById('status');
            try {
                statusDiv.innerText = "Searching...";
                
                // Bluefy compatible scan request
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
                });

                statusDiv.innerText = "Connecting...";
                const server = await bleDevice.gatt.connect();

                statusDiv.innerText = "Accessing Services...";
                const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');

                statusDiv.innerText = "Connected to " + (bleDevice.name || "Lights") + "!";
                statusDiv.style.color = "#34c759";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error: " + (error.message || "Failed to pair");
                statusDiv.style.color = "#ff3b30";
                alert("Connection failed. Make sure nRF Connect is force-closed!");
            }
        }

        async function sendHex(hexString) {
            if (!bleCharacteristic) return alert("Please tap 'Connect to Lights' first!");
            try {
                const bytes = new Uint8Array(hexString.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                await bleCharacteristic.writeValue(bytes);
            } catch (e) {
                alert("Send failed: " + e.message);
            }
        }

        function setColor(r, g, b) {
            const hexR = r.toString(16).padStart(2, '0');
            const hexG = g.toString(16).padStart(2, '0');
            const hexB = b.toString(16).padStart(2, '0');
            sendHex(`7e070503${hexR}${hexG}${hexB}00ef`);
        }
    </script>
</body>
</html>
